version: 0.2
#  NOTES  #
## The version above is the buildspec type version, **NOT** my version of the file - changing it will break the script
#
## Note use of double quotes round all commands - the yml parser in codeBuild will fail anywhere that variable
## placeholders are used, and in some other unexpected cases.  For uniformity it's easiest to double quote all command strings
#
## ECR login details are available to the script as the EC2 instance has permissions set in IAM role.
phases:
  pre_build:
    commands:
      - "echo '--- PRE_BUILD PHASE ---'"
      - "echo 'Logging in to Amazon ECR...'"
      - "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)"
      - "aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
      - "echo 'Making deployment scripts executable...'"
      - "chmod +x scripts/*.sh"
      - "echo 'Verifying CodeBuild variables...'"
      - "echo 'AWS Default Region: $AWS_DEFAULT_REGION'"
      - "echo 'Source Version: $CODEBUILD_RESOLVED_SOURCE_VERSION'"
      - "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)"
      - "echo 'Discovered AWS Account ID: $AWS_ACCOUNT_ID'"

  build:
    commands:
      - "echo '--- BUILD PHASE ---'"
      - "REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/bake-api"
      - "IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)"
      - "echo Building Docker image $REPOSITORY_URI:$IMAGE_TAG"
      - "docker build -t $REPOSITORY_URI:latest ."
      - "docker tag $REPOSITORY_URI:latest $REPOSITORY_URI:$IMAGE_TAG"

  post_build:
    commands:
      - "echo '--- POST_BUILD PHASE ---'"
      - "echo 'Pushing Docker images to ECR...'"
      - "docker push $REPOSITORY_URI:latest"
      - "docker push $REPOSITORY_URI:$IMAGE_TAG"
      - "echo 'Packaging deployment artifacts...'"
      - "mkdir -p deploy"
      - "cp appspec.yml deploy/"
      - "cp -r scripts deploy/"
      - "echo 'Artifacts ready in deploy/'"

artifacts:
  files:
    - deploy/**/*