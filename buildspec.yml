version: 0.2

phases:
  pre_build:
    commands:
      - echo "--- PRE_BUILD PHASE ---"
      - echo "Making deployment scripts executable..."
      - chmod +x scripts/*.sh
      - echo "Verifying standard CodeBuild variables..."
      - echo "AWS Default Region: $AWS_DEFAULT_REGION"
      - echo "Source Version (Full Commit Hash): $CODEBUILD_RESOLVED_SOURCE_VERSION"
      - echo "Discovering AWS Account ID..."
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - echo "Discovered AWS Account ID: $AWS_ACCOUNT_ID"

  build:
    commands:
      - echo "--- BUILD PHASE ---"
      - "REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/bake-api"
      - "IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)"
      - "echo Building Docker image $REPOSITORY_URI:$IMAGE_TAG"
      # Quote the docker commands to prevent YAML parsing errors around the colons
      - "docker build -t $REPOSITORY_URI:latest ."
      - "docker tag $REPOSITORY_URI:latest $REPOSITORY_URI:$IMAGE_TAG"

  post_build:
    commands:
      - echo "--- POST_BUILD PHASE ---"
      - echo "Pushing Docker images to ECR..."
      - "docker push $REPOSITORY_URI:latest"
      - "docker push $REPOSITORY_URI:$IMAGE_TAG"
      - echo "Packaging deployment artifacts..."
      - mkdir -p deploy
      - cp appspec.yml deploy/
      - cp -r scripts deploy/
      - echo "Artifacts ready in deploy/"

artifacts:
  files:
    - deploy/**/*
